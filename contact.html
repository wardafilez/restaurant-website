<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Eden Rose</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3e9dc; /* Aapka pasandida color */
            color: #333;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 26px;
            font-weight: bold;
            color: #800020;
        }

        nav a {
            text-decoration: none;
            color: #800020 !important;
            background-color: #f3e9dc;
            padding: 8px 20px;
            margin-left: 15px;
            font-weight: 600;
            border-radius: 20px;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
            display: inline-block;
        }

        nav a:hover {
            background-color: #590016;
            color: white !important;
            transform: scale(1.05);
        }

        /* --- CONTACT SECTION STYLE --- */
        .contact-page-section {
            padding: 60px 5%;
            text-align: center;
        }

        .contact-page-title {
            color: #800020;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .contact-page-subtitle {
            color: #800020;
            font-size: 16px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .contact-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        @media (min-width: 768px) {
            .contact-container {
                flex-direction: row;
                text-align: left;
            }
            .contact-info-side, .contact-form-side {
                flex: 1;
            }
        }

        .contact-info-side {
            display: flex;
            flex-direction: column;
            gap: 25px;
            text-align: left;
        }

        .info-box h3 {
            color: #800020;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .info-box p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
        }

        .contact-form-side {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form-side input, .contact-form-side textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #fcf8f2;
        }

        .contact-form-side input:focus, .contact-form-side textarea:focus {
            border-color: #800020;
        }

        .submit-btn {
            background-color: #800020;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .submit-btn:hover {
            background-color: #590016;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/logo.png" class="logo-img">
            <span class="brand-name">The Eden Rose</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="contact-page-section">
        <h1 class="contact-page-title">Get In Touch</h1>
        <p class="contact-page-subtitle">We would love to hear from you. Visit us or drop a message!</p>

        <div class="contact-container">
            
            <!-- Left Side: Info -->
            <div class="contact-info-side">
                <div class="info-box">
                    <h3>📍 Location</h3>
                    <p>College Road, Daska, Pakistan</p>
                </div>
                <div class="info-box">
                    <h3>📞 Phone Number</h3>
                    <p>+92 300 1234567</p>
                </div>
                <div class="info-box">
                    <h3>⏰ Timings</h3>
                    <p>Monday - Sunday: 11:00 AM - 1:00 AM</p>
                </div>
            </div>

            <!-- Right Side: Form -->
            <form class="contact-form-side" action="#" method="POST">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email Address" required>
                <input type="text" placeholder="Subject">
                <textarea rows="5" placeholder="Your Message Here..." required></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

        </div>
    </section>

</body>
</html>
