<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eden Rose Restaurant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            color: #333;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 26px;
            font-weight: bold;
            color: #800020;
        }

        nav a {
            text-decoration: none;
            color: #555;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.3s;
            cursor: pointer;
        }

        nav a:hover {
            color: #800020;
        }

        .hero {
            background: linear-gradient(rgba(128, 0, 32, 0.05), rgba(128, 0, 32, 0.05)), #f3e9dc;
            text-align: center;
            padding: 100px 20px;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo-center {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .hero h1 {
            font-size: 48px;
            color: #800020;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #800020;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s;
            display: inline-block;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background-color: #590016;
        }

        /* --- POP-UP MENU SECTION STYLES --- */
        .menu-modal {
            display: none; /* Shuru me menu chupa rahega */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* Background dhundla karne k liye */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-content {
            background-color: #fcf8f2;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: #800020;
            cursor: pointer;
            font-weight: bold;
        }

        .menu-title {
            color: #800020;
            font-size: 28px;
            margin-bottom: 20px;
            border-bottom: 2px solid #800020;
            padding-bottom: 10px;
        }

        .menu-items {
            text-align: left;
            margin-top: 15px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="images/logo.png" class="logo-img">
            <span class="brand-name">The Eden Rose</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <!-- Tareeqa 1: Navbar ka menu link jis pr click krne se pop-up khulega -->
            <a id="nav-menu-btn">Menu</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <img src="images/logo.png" class="logo-center">
            <div>
                <h1>The Eden Rose</h1>
                <h2 style="font-size: 28px; color: #800020; font-weight: normal; margin-bottom: 15px;">Delicious Food Awaits You</h2>
                <p>Experience the authentic taste of premium Pakistani cuisine.</p>
                <!-- Tareeqa 2: Center (Mid) waala button jis pr click krne se bhi pop-up khulega -->
                <button id="mid-menu-btn" class="btn">View Menu</button>
            </div>
        </div>
    </section>

    <!-- --- POP-UP MENU BOX (MODAL) --- -->
    <div id="menuModal" class="menu-modal">
        <div class="menu-content">
            <span id="closeMenuBtn" class="close-btn">&times;</span>
            <h2 class="menu-title">Our Premium Menu</h2>
            
            <div class="menu-items">
                <div class="menu-item">
                    <span>Chicken Biryani</span>
                    <strong>Rs. 450</strong>
                </div>
                <div class="menu-item">
                    <span>Mutton Karahi</span>
                    <strong>Rs. 1200</strong>
                </div>
                <div class="menu-item">
                    <span>Seekh Kabab</span>
                    <strong>Rs. 350</strong>
                </div>
                <div class="menu-item">
                    <span>Garlic Naan</span>
                    <strong>Rs. 60</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- --- JAVASCRIPT CODE --- -->
    <script>
        // HTML elements ko select karna
        const navMenuBtn = document.getElementById('nav-menu-btn');
        const midMenuBtn = document.getElementById('mid-menu-btn');
        const menuModal = document.getElementById('menuModal');
        const closeMenuBtn = document.getElementById('closeMenuBtn');

        // Menu kholne ka function
        function openMenu() {
            menuModal.style.display = 'flex';
        }

        // Menu band karne ka function
        function closeMenu() {
            menuModal.style.display = 'none';
        }

        // Dono buttons par click event lagana (Menu kholne k liye)
        navMenuBtn.addEventListener('click', openMenu);
        midMenuBtn.addEventListener('click', openMenu);

        // Close button par click event lagana (Menu band krne k liye)
        closeMenuBtn.addEventListener('click', closeMenu);

        // Agar user menu se baher kali jagah par click kare toh bhi menu band ho jaye
        window.addEventListener('click', function(event) {
            if (event.target === menuModal) {
                closeMenu();
            }
        });
    </script>

</body>
</html>
