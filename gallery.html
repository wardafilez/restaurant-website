<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - The Eden Rose</title>
    <style>
        /* --- 🎨 MAIN STYLES (LAPTOP & GENERAL) --- */
        body {
            background-color: #ffffff; 
            color: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Left Side Brand Container */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Cute Chef Circular Logo */
        .chef-logo {
            width: 150px; /* Laptop standard size */
            height: auto;
            display: block;
        }

        /* Restaurant Name Title */
        .restaurant-title {
            font-size: 26px;
            font-weight: bold;
            color: #800020; /* Your original elegant maroon color */
            margin: 0;
        }

        /* Navigation Buttons */
        .navbar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 15px;
        }
        .navbar ul li a {
            text-decoration: none;
            color: #800020; /* Original Maroon text */
            font-weight: 600;
            font-size: 15px;
            padding: 8px 20px;
            border-radius: 20px;
            background-color: #fbf0f2; /* Light cute maroon hue */
            transition: 0.3s;
        }
        .navbar ul li a.active, .navbar ul li a:hover {
            background-color: #800020;
            color: #ffffff;
        }

        /* Content Sections */
        .gallery-intro {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }
        .gallery-intro h2 {
            font-size: 32px;
            color: #800020;
            margin-bottom: 5px;
        }
        .gallery-intro p {
            font-size: 16px;
            color: #666666;
            margin-top: 0;
        }

        /* --- 📱 MOBILE RESPONSIVE LAYOUT (NO COLOR CHANGES) --- */
        @media (max-width: 768px) {
            /* Pure header area ko center kiya aur height kam ki */
            header {
                flex-direction: column !important;
                padding: 15px 10px !important;
                text-align: center !important;
                gap: 10px !important;
            }

            .brand-container {
                flex-direction: column !important;
                gap: 5px !important;
            }

            /* ⚡ Badi chef image ko mobile par chota aur perfectly normal kiya */
            .chef-logo {
                width: 75px !important;  /* Half size for beautiful view */
                height: auto !important;
            }

            /* "The Eden Rose" heading ka size screen ke mutabiq adjust kiya */
            .restaurant-title {
                font-size: 19px !important;
                margin-top: 2px !important;
            }

            /* Home aur Gallery buttons ko aapas mein fit aur neat kiya */
            .navbar ul {
                justify-content: center !important;
                gap: 10px !important;
                margin-top: 5px !important;
            }
            .navbar ul li a {
                font-size: 13px !important;
                padding: 6px 15px !important;
            }

            /* Upper main title section spacing optimize */
            .gallery-intro {
                padding: 20px 10px !important;
            }
            .gallery-intro h2 {
                font-size: 22px !important;
            }
            .gallery-intro p {
                font-size: 13px !important;
            }
        }
    </style>
</head>
<body>

    <!-- 👑 TOP HEADER SECTION -->
    <header>
        <div class="brand-container">
            <!-- Aapki original chef round image -->
            <img src="chef.png" alt="The Eden Rose Logo" class="chef-logo">
            <h1 class="restaurant-title">The Eden Rose</h1>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <!-- 🌹 GALLERY INTRO SECTION -->
    <div class="gallery-intro">
        <h2>Our Ambience & Interior</h2>
        <p>Take a virtual tour of our beautiful restaurant sitting and fine dining decor.</p>
    </div>

</body>
</html>
